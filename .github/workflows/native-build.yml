name: Native test builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: 21}
      - run: npm ci
      - run: npm run build:native
      - run: npx --no-install cap sync android
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: fluxo-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - name: Select Xcode 26
        run: |
          xcode_path=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort | tail -n 1)
          test -n "$xcode_path"
          sudo xcode-select -s "$xcode_path/Contents/Developer"
          xcodebuild -version
      - run: npm ci
      - run: npm run build:native
      - run: npx --no-install cap sync ios
      - name: Build unsigned simulator app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Archive simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Debug-iphonesimulator/App.app fluxo-ios-simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: fluxo-ios-simulator
          path: fluxo-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
