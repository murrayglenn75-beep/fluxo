name: Fluxo native export verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:native
      - name: Verify exported application
        run: test -f out/index.html
